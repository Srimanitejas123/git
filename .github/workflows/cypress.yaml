# github action pipeline to run cypress tests

name: Cypress Tests

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  cypress-run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm ci

      - name: Run Cypress tests (built-in runner)
        run: npx cypress run
